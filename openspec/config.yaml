schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  SimpleShop is a local demo shop (Spring Boot 3 / Java 17 / in-memory H2 backend on :8181,
  React + Vite frontend on :3000). Baseline specs describe CURRENT behavior, including known
  quirks (no backend auth, not-found returned as 400, order status flow not enforced).
  Changing a quirk must be an explicit requirement change, not a side effect.
  Prices are stored in DKK. The only automated test is a Spring context-load test, so
  tasks should include manual or curl verification steps.


rules:
  tasks:
    - Break the work down using vertical slicing. Each task group is one thin,
      end-to-end increment of user-visible functionality, not one technical layer.
    - Every increment must include the changes needed in every affected layer
      (database, data access, business logic, API, UI), so it can be verified end to end.
    - Never create layer-only increments such as "create all database tables" or
      "build all API endpoints".
    - Order increments so the first one is the simplest working end-to-end path
      (walking skeleton), and each following increment adds one behavior or rule.
    - End each increment with a verification task that tests the slice end to end
      (an automated test, or manual steps in the running webshop).
    - Name each increment after the user-visible outcome, e.g.
      "Customer can give a star rating on the Details page".
    - Each increment should leave the application in a working, deployable state.
  design:
    - Describe how the feature can be split into thin vertical slices, and which
      layers each slice touches.
      
# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
